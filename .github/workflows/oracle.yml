name: Publicar na Oracle Cloud

# A cada push na main e de 6 em 6 horas (a ronda da lista de faróis), entrega o site na VM da Oracle (a mesma do
# Linu Sites e da LinuPedia). A chave do
# segredo ORACLE_SSH_KEY entra como o usuário "linufarol", que NÃO tem sudo, e só consegue rodar
# /opt/linu-farol/receber.sh (comando forçado): só troca o Linu Farol.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # a ronda: confere as luzes dos sites da família e publica a lista nova
  workflow_dispatch:

concurrency:
  group: oracle
  cancel-in-progress: false

env:
  VM_HOST: 168.138.155.95
  SITE: https://farol.linupedia.com.br

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o segredo
        id: check
        run: |
          if [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::O segredo ORACLE_SSH_KEY ainda não existe. Nada foi publicado."
          else
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A ronda: as quatro luzes de cada site da família, com o histórico lido da lista publicada
      - name: Ronda
        run: python3 ferramentas/ronda.py --anterior "$SITE/dados/ronda.json"
      # O painel de cada cliente (07/11/2026): a lista de clientes vem do segredo FAROL_CLIENTES (o repositório é
      # público); sem ele, só o painel de exemplo. O histórico de cada um vem do painel publicado.
      - name: Painéis dos clientes
        env:
          FAROL_CLIENTES: ${{ secrets.FAROL_CLIENTES }}
        run: python3 ferramentas/painel.py --anterior "$SITE"
      - name: Conferir a página
        run: |
          test -f index.html
          npx --yes html-validate@10.1.2 *.html p/exemplo/index.html
          python3 deploy/conferir-pagina.py
          python3 ferramentas/precos-servicos.py --conferir
          # a versão de cada arquivo pelo conteúdo (?v=hash): o navegador guarda /img, /css e /js por 7 dias
          python3 ferramentas/versao-arquivos.py . *.html p/*/index.html
      # A conferência visual (07/11/2026): 390, 820 e 1280 px, claro e escuro; reprova com rolagem lateral, erro no
      # console, arquivo faltando ou falha séria de acessibilidade (axe). As capturas ficam como artefato da execução.
      - name: Conferência visual
        if: github.event_name != 'schedule'
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0 axe-core@4.10.3
          # o --with-deps passa pelo apt do Ubuntu; quando o espelho da máquina do GitHub não responde (11/11/2026, o
          # linu-sites reprovou três vezes assim), a imagem já traz as bibliotecas do navegador: instala só o Chromium
          npx playwright install --with-deps chromium || npx playwright install chromium
          node ferramentas/conferir-visual.mjs --raiz . --paginas /,/p/exemplo/ --saida capturas
      - name: Guardar as capturas
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
          retention-days: 14
      - name: Entregar na VM
        if: steps.check.outputs.tem == 'sim'
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::O segredo ORACLE_HOST_KEY não existe: a chave da VM foi aceita sem conferir."
            ssh-keyscan -T 15 "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          # Só o que o site usa: as páginas, css/, js/, img/, fontes/, dados/ (a ronda), p/ (os painéis), robots.txt e sitemap.xml (os .md e deploy/ ficam de fora)
          tar czf - *.html robots.txt sitemap.xml css js img fontes dados p \
            | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "linufarol@$VM_HOST"
      - name: Conferir o site
        if: steps.check.outputs.tem == 'sim'
        run: curl -fsS --max-time 20 -o /dev/null "$SITE/" && echo "$SITE no ar"
