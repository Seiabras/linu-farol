<!DOCTYPE html>
<!-- A imagem de compartilhar do Linu Farol (1200 × 630, 11/11/2026): o farol em 2× e o Linu de luneta em 1×, a proporção da
     abertura do site. Gerar de novo: node ferramentas/compartilhar/gerar.mjs -->
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/fontes.css">
<link rel="stylesheet" href="../../css/estilo.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; display: grid; grid-template-columns: 1fr 520px;
         align-items: center; padding: 0 40px 0 72px; background: linear-gradient(180deg, var(--ceu-1), var(--ceu-2)); position: relative; }
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: var(--mar); }
  .rotulo { font: 600 24px "IBM Plex Mono", monospace; color: var(--farol); margin: 0 0 14px; }
  h1 { font: 800 120px/0.92 "Big Shoulders Display", sans-serif; margin: 0; color: var(--tinta); }
  h1 span { color: var(--farol); }
  .frase { font: 400 30px/1.3 "Public Sans", sans-serif; color: var(--tinta-suave); margin: 22px 0 0; max-width: 560px; }
  .luzes { display: flex; gap: 12px; margin: 26px 0 0; padding: 0; list-style: none; }
  .luzes li { display: flex; align-items: center; gap: 8px; font: 600 22px "Public Sans", sans-serif; color: var(--tinta);
              background: var(--papel); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 14px; }
  .luzes li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--acesa); }
  .pe { font: 600 22px "IBM Plex Mono", monospace; color: var(--mar); margin: 30px 0 0; }
  .cena { display: flex; align-items: flex-end; justify-content: center; gap: 24px; align-self: end; padding-bottom: 22px; }
  .cena img { image-rendering: pixelated; display: block; }
</style></head><body>
  <div>
    <p class="rotulo">O painel do mês</p>
    <h1>Linu <span>Farol</span></h1>
    <p class="frase">O site no ar, o cadeado, a rapidez e as visitas do seu negócio, numa página só.</p>
    <ul class="luzes"><li>Luz</li><li>Cadeado</li><li>Rapidez</li><li>Trancas</li></ul>
    <p class="pe">farol.linupedia.com.br</p>
  </div>
  <div class="cena">
    <img src="../../img/farol.png" alt="" width="220" height="442">
    <img src="../../img/linu-luneta.png" alt="" width="124" height="198">
  </div>
</body></html>
